<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FLUID</title>
<meta name="description" content="An interactive liquid chrome playground — black, white and red. Move your mouse, steer with arrow keys, click to burst, or turn on your camera to see yourself reflected in the metal.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23ff2b2b'/%3E%3C/svg%3E">
<style>
  :root{
    color-scheme: dark;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  canvas{
    display: block;
    position: fixed;
    inset: 0;
    touch-action: none;
  }
  #ui{
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: clamp(16px, 4vw, 40px);
    color: #fff;
    z-index: 5;
  }
  #title{
    font-weight: 700;
    letter-spacing: 0.3em;
    font-size: clamp(20px, 3.5vw, 34px);
    text-transform: uppercase;
    opacity: 0.9;
    transition: opacity 1.2s ease;
    mix-blend-mode: difference;
  }
  #title span{
    color: #ff2b2b;
  }
  #bottom{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  #hint{
    font-size: clamp(10px, 1.4vw, 13px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.55;
    line-height: 1.8;
    transition: opacity 1.5s ease;
    mix-blend-mode: difference;
  }
  #hint b{ color: #ff2b2b; font-weight: 700; }
  .faded{ opacity: 0 !important; }
  #camBtn{
    pointer-events: auto;
    margin-top: 10px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    font-family: inherit;
    font-size: clamp(9px, 1.2vw, 11px);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.6em 1em;
    cursor: pointer;
    transition: opacity 1.5s ease, border-color 0.2s ease, color 0.2s ease;
  }
  #camBtn:hover{ border-color: #ff2b2b; color: #ff2b2b; }
  #camBtn:disabled{ cursor: default; opacity: 0.5; border-color: rgba(255,255,255,0.2); color: #fff; }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="ui">
  <div id="title">FLU<span>I</span>D</div>
  <div id="bottom">
    <div id="hint">
      move mouse to disturb &nbsp;·&nbsp; hold click to <b>pull</b>, release to <b>push</b><br>
      arrow keys / WASD to steer the <b>red</b> core &nbsp;·&nbsp; space to burst
    </div>
    <button id="camBtn" type="button">see yourself in the metal</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  const off = document.createElement('canvas');
  const octx = off.getContext('2d');

  const titleEl = document.getElementById('title');
  const hintEl = document.getElementById('hint');
  const camBtn = document.getElementById('camBtn');

  // hidden webcam feed + a same-size scratch canvas we sample from.
  // kept in the DOM (not display:none) since some browsers pause or
  // never start a fully detached/hidden <video>.
  const video = document.createElement('video');
  video.autoplay = true;
  video.playsInline = true;
  video.setAttribute('playsinline', '');
  video.muted = true;
  video.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;pointer-events:none;';
  document.body.appendChild(video);
  const camCanvas = document.createElement('canvas');
  const camCtx = camCanvas.getContext('2d');
  const cam = { enabled: false, ready: false };

  let W = 0, H = 0, DPR = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 1.5);
    W = canvas.width = off.width = camCanvas.width = Math.floor(innerWidth * DPR);
    H = canvas.height = off.height = camCanvas.height = Math.floor(innerHeight * DPR);
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
  }
  addEventListener('resize', resize);
  resize();

  function rand(a, b){ return a + Math.random() * (b - a); }
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  let lightAngle = rand(0, Math.PI * 2);
  let globalTime = 0;

  camBtn.addEventListener('click', () => {
    if (cam.enabled) return;
    cam.enabled = true;
    camBtn.textContent = 'requesting camera…';
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(stream => {
        video.srcObject = stream;
        return video.play();
      })
      .then(() => {
        cam.ready = true;
        camBtn.textContent = 'camera reflection on';
        camBtn.disabled = true;
        wake();
      })
      .catch(err => {
        cam.enabled = false;
        camBtn.textContent = 'camera blocked — try again';
        console.warn('camera unavailable:', err && err.message);
      });
  });

  // draw the current webcam frame into camCanvas, mirrored like a mirror
  // and cropped to cover the full canvas without stretching the face
  function updateCamFrame(){
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return;
    const scale = Math.max(W / vw, H / vh);
    const dw = vw * scale, dh = vh * scale;
    const dx = (W - dw) / 2, dy = (H - dh) / 2;
    camCtx.save();
    camCtx.translate(W, 0);
    camCtx.scale(-1, 1);
    camCtx.drawImage(video, dx, dy, dw, dh);
    camCtx.restore();
  }

  // ---------- input ----------
  const mouse = { x: -9999, y: -9999, active: false, down: false };
  const keys = { up:false, down:false, left:false, right:false };

  function pointerPos(e){
    const t = (e.touches && e.touches[0]) || e;
    return { x: t.clientX * DPR, y: t.clientY * DPR };
  }

  window.addEventListener('mousemove', e => {
    const p = pointerPos(e);
    mouse.x = p.x; mouse.y = p.y; mouse.active = true;
    wake();
  }, { passive: true });

  window.addEventListener('mousedown', () => { mouse.down = true; wake(); });
  window.addEventListener('mouseup', () => { mouse.down = false; });
  window.addEventListener('mouseleave', () => { mouse.active = false; });

  window.addEventListener('touchstart', e => {
    const p = pointerPos(e);
    mouse.x = p.x; mouse.y = p.y; mouse.active = true; mouse.down = true;
    wake();
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    const p = pointerPos(e);
    mouse.x = p.x; mouse.y = p.y; mouse.active = true;
  }, { passive: true });
  window.addEventListener('touchend', () => { mouse.down = false; mouse.active = false; });

  const keyMap = {
    ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right',
    KeyW:'up', KeyS:'down', KeyA:'left', KeyD:'right'
  };

  window.addEventListener('keydown', e => {
    if (keyMap[e.code]){ keys[keyMap[e.code]] = true; wake(); e.preventDefault(); }
    if (e.code === 'Space'){ burst(player.x, player.y, 1); wake(); e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    if (keyMap[e.code]){ keys[keyMap[e.code]] = false; }
  });

  window.addEventListener('click', e => {
    burst(e.clientX * DPR, e.clientY * DPR, 0.7);
  });

  let awake = false;
  function wake(){
    if (awake) return;
    awake = true;
    titleEl.classList.add('faded');
    setTimeout(() => hintEl.classList.add('faded'), 3200);
  }

  // ---------- ripples (click / space bursts) ----------
  const ripples = [];
  function burst(x, y, power){
    ripples.push({ x, y, r: 0, power, life: 1 });
  }

  // ---------- blobs ----------
  class Blob{
    constructor(isPlayer, tier){
      this.isPlayer = !!isPlayer;
      this.tier = tier || 'mid';
      const sizeRange = this.tier === 'giant' ? [190, 340] : this.tier === 'mid' ? [80, 180] : [36, 48];
      this.r = (isPlayer ? rand(46, 56) : rand(sizeRange[0], sizeRange[1])) * DPR;
      this.x = rand(this.r, W - this.r);
      this.y = rand(this.r, H - this.r);
      this.vx = rand(-0.15, 0.15);
      this.vy = rand(-0.15, 0.15);
      this.color = isPlayer ? 'red' : (Math.random() < 0.32 ? 'warm' : 'metal');
      this.accent = !isPlayer && Math.random() < 0.5;
      this.accentAngle = rand(0, Math.PI * 2);
      this.wander = rand(0, Math.PI * 2);
      this.wanderSpeed = this.tier === 'giant' ? rand(0.003, 0.008) : rand(0.01, 0.025);
      this.flowPhase = rand(0, Math.PI * 2);
      this.breathePhase = rand(0, Math.PI * 2);
      this.breatheSpeed = rand(0.4, 0.9);
      this.breatheAmt = rand(0.03, 0.07);
      this.zoom = rand(1.3, 1.9);
      this.ripplePhase = rand(0, Math.PI * 2);
      this.rippleSpeed = rand(0.3, 0.7);
      this.baseR = this.r;
    }

    place(x, y){
      this.x = x;
      this.y = y;
      this.homeX = x;
      this.homeY = y;
      this.baseR = this.r;
    }

    update(){
      // slow "breathing" pulse so the surface feels alive at rest
      this.r = this.baseR * (1 + Math.sin(globalTime * this.breatheSpeed + this.breathePhase) * this.breatheAmt);

      if (!this.isPlayer){
        this.wander += rand(-this.wanderSpeed, this.wanderSpeed);
        this.vx += Math.cos(this.wander) * 0.02;
        this.vy += Math.sin(this.wander) * 0.02;

        // a gentle current everyone drifts with, phase-shifted per blob
        // so the whole surface sways instead of holding dead still
        const flow = globalTime * 0.1 + this.flowPhase;
        this.vx += Math.cos(flow) * 0.012;
        this.vy += Math.sin(flow) * 0.012;

        // gentle spring back to its home slot so the metal keeps
        // covering the screen instead of drifting into clumps
        const springK = this.tier === 'giant' ? 0.0009 : 0.002;
        this.vx += (this.homeX - this.x) * springK;
        this.vy += (this.homeY - this.y) * springK;
      } else {
        const ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        const ay = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
        this.vx += ax * 0.55 * DPR;
        this.vy += ay * 0.55 * DPR;
      }

      // mouse field
      if (mouse.active){
        const dx = this.x - mouse.x, dy = this.y - mouse.y;
        const dist = Math.hypot(dx, dy) || 1;
        const influence = 260 * DPR;
        if (dist < influence){
          const strength = (1 - dist / influence) * 0.9 * DPR;
          const sign = mouse.down ? -1 : 1; // hold = pull in, release = push away
          this.vx += (dx / dist) * strength * sign;
          this.vy += (dy / dist) * strength * sign;
        }
      }

      // ripple forces
      for (const rp of ripples){
        const dx = this.x - rp.x, dy = this.y - rp.y;
        const dist = Math.hypot(dx, dy) || 1;
        const band = 90 * DPR;
        const d = Math.abs(dist - rp.r);
        if (d < band){
          const f = (1 - d / band) * rp.power * rp.life * 2.2 * DPR;
          this.vx += (dx / dist) * f;
          this.vy += (dy / dist) * f;
        }
      }

      this.vx *= 0.94;
      this.vy *= 0.94;

      const tierSpeed = this.tier === 'giant' ? 0.6 : this.tier === 'mid' ? 1.4 : 1.8;
      const maxSpeed = (this.isPlayer ? 9 : tierSpeed) * DPR;
      const sp = Math.hypot(this.vx, this.vy);
      if (sp > maxSpeed){
        this.vx = (this.vx / sp) * maxSpeed;
        this.vy = (this.vy / sp) * maxSpeed;
      }

      this.x += this.vx;
      this.y += this.vy;

      if (this.x < this.r){ this.x = this.r; this.vx *= -0.5; }
      if (this.x > W - this.r){ this.x = W - this.r; this.vx *= -0.5; }
      if (this.y < this.r){ this.y = this.r; this.vy *= -0.5; }
      if (this.y > H - this.r){ this.y = H - this.r; this.vy *= -0.5; }
    }

    drawBody(){
      if (cam.ready){ this.drawReflectiveBody(); return; }

      const lx = this.x + Math.cos(lightAngle) * this.r * 0.4;
      const ly = this.y + Math.sin(lightAngle) * this.r * 0.4;

      const g = octx.createRadialGradient(lx, ly, this.r * 0.05, this.x, this.y, this.r);
      if (this.color === 'red'){
        g.addColorStop(0,    'rgba(255,246,243,1)');
        g.addColorStop(0.14, 'rgba(232,56,43,0.92)');
        g.addColorStop(0.4,  'rgba(120,30,24,0.78)');
        g.addColorStop(0.65, 'rgba(45,12,10,0.5)');
        g.addColorStop(0.88, 'rgba(15,8,7,0.2)');
        g.addColorStop(1,    'rgba(0,0,0,0)');
      } else if (this.color === 'warm'){
        g.addColorStop(0,    'rgba(255,212,197,0.95)');
        g.addColorStop(0.22, 'rgba(200,60,45,0.85)');
        g.addColorStop(0.5,  'rgba(110,30,22,0.65)');
        g.addColorStop(0.75, 'rgba(40,12,10,0.38)');
        g.addColorStop(1,    'rgba(0,0,0,0)');
      } else {
        g.addColorStop(0,    'rgba(232,232,237,0.92)');
        g.addColorStop(0.22, 'rgba(150,150,157,0.85)');
        g.addColorStop(0.5,  'rgba(75,75,80,0.65)');
        g.addColorStop(0.75, 'rgba(32,32,35,0.38)');
        g.addColorStop(1,    'rgba(0,0,0,0)');
      }
      octx.fillStyle = g;
      octx.beginPath();
      octx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      octx.fill();
    }

    // fake a convex mirror: sample a small, zoomed-in crop of the webcam
    // frame centred on the blob so it bulges like a reflection, then
    // multiply a sphere-shaped shading map on top so it still reads as
    // metal rather than a flat photo
    drawReflectiveBody(){
      const wobbleX = Math.sin(globalTime * this.rippleSpeed + this.ripplePhase) * this.r * 0.08;
      const wobbleY = Math.cos(globalTime * this.rippleSpeed * 0.8 + this.ripplePhase) * this.r * 0.08;
      const sw = Math.min((2 * this.r) / this.zoom, W);
      const sh = Math.min((2 * this.r) / this.zoom, H);
      const sx = clamp(this.x + wobbleX - sw / 2, 0, Math.max(0, W - sw));
      const sy = clamp(this.y + wobbleY - sh / 2, 0, Math.max(0, H - sh));

      octx.save();
      octx.beginPath();
      octx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      octx.clip();
      octx.drawImage(camCanvas, sx, sy, sw, sh, this.x - this.r, this.y - this.r, this.r * 2, this.r * 2);

      const lx = this.x + Math.cos(lightAngle) * this.r * 0.4;
      const ly = this.y + Math.sin(lightAngle) * this.r * 0.4;
      const dark = this.color === 'red' ? '20,4,3' : this.color === 'warm' ? '35,10,7' : '12,12,14';
      const sg = octx.createRadialGradient(lx, ly, this.r * 0.05, this.x, this.y, this.r);
      sg.addColorStop(0,    'rgba(255,255,255,1)');
      sg.addColorStop(0.32, 'rgba(255,255,255,0.6)');
      sg.addColorStop(0.7,  `rgba(${dark},0.5)`);
      sg.addColorStop(1,    `rgba(${dark},0.9)`);
      octx.globalCompositeOperation = 'multiply';
      octx.fillStyle = sg;
      octx.beginPath();
      octx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
      octx.fill();

      octx.restore();
    }

    drawShine(){
      // broad soft sheen — the smooth gradient sweep chrome renders as
      const sr = this.r * 0.55;
      const sx = this.x - Math.cos(lightAngle) * this.r * 0.3;
      const sy = this.y - Math.sin(lightAngle) * this.r * 0.3;
      const sg = octx.createRadialGradient(sx, sy, 0, sx, sy, sr);
      sg.addColorStop(0, 'rgba(255,255,255,0.22)');
      sg.addColorStop(1, 'rgba(255,255,255,0)');
      octx.fillStyle = sg;
      octx.beginPath();
      octx.arc(sx, sy, sr, 0, Math.PI * 2);
      octx.fill();

      // tight glossy hotspot for the chrome highlight
      const hr = this.r * 0.11;
      const hx = this.x - Math.cos(lightAngle) * this.r * 0.42;
      const hy = this.y - Math.sin(lightAngle) * this.r * 0.42;
      const hg = octx.createRadialGradient(hx, hy, 0, hx, hy, hr);
      hg.addColorStop(0, 'rgba(255,255,255,0.9)');
      hg.addColorStop(1, 'rgba(255,255,255,0)');
      octx.fillStyle = hg;
      octx.beginPath();
      octx.arc(hx, hy, hr, 0, Math.PI * 2);
      octx.fill();

      // red light reflecting within the metal surface
      if (this.accent){
        const ar = Math.min(this.r * 0.42, 80 * DPR);
        const ax = this.x + Math.cos(this.accentAngle + lightAngle) * this.r * 0.5;
        const ay = this.y + Math.sin(this.accentAngle + lightAngle) * this.r * 0.5;
        const ag = octx.createRadialGradient(ax, ay, 0, ax, ay, ar);
        ag.addColorStop(0, 'rgba(255,80,55,0.5)');
        ag.addColorStop(0.6, 'rgba(255,40,30,0.2)');
        ag.addColorStop(1, 'rgba(255,40,30,0)');
        octx.fillStyle = ag;
        octx.beginPath();
        octx.arc(ax, ay, ar, 0, Math.PI * 2);
        octx.fill();
      }
    }
  }

  const player = new Blob(true);
  const blobs = [player];
  const GIANTS = 6, MIDS = 12;
  for (let i = 0; i < GIANTS; i++) blobs.push(new Blob(false, 'giant'));
  for (let i = 0; i < MIDS; i++) blobs.push(new Blob(false, 'mid'));

  // tile giants across a coarse grid, sized so neighbours overlap and the
  // metal covers the whole screen; mids ride on top in a finer grid for
  // surface detail. A "home" slot lets physics jostle them without ever
  // opening up bare black gaps.
  (function layout(){
    function tile(list, growToFill){
      if (!list.length) return;
      const cols = Math.max(1, Math.round(Math.sqrt(list.length * (W / H))));
      const rows = Math.ceil(list.length / cols);
      const cellW = W / cols, cellH = H / rows;
      // rows*cols can exceed list.length, leaving trailing grid cells with
      // no blob in them — grow radii enough that neighbours cover the gap
      const emptyCells = cols * rows - list.length;
      const growth = emptyCells > 0 ? [0.95, 1.3] : [0.6, 0.85];
      list.forEach((b, i) => {
        if (growToFill) b.r = rand(growth[0], growth[1]) * Math.max(cellW, cellH);
        const cx = (i % cols + 0.5) * cellW;
        const cy = (Math.floor(i / cols) + 0.5) * cellH;
        b.place(
          clamp(cx + rand(-cellW, cellW) * 0.3, b.r, W - b.r),
          clamp(cy + rand(-cellH, cellH) * 0.3, b.r, H - b.r)
        );
      });
    }
    tile(blobs.filter(b => b.tier === 'giant'), true);
    tile(blobs.filter(b => b.tier === 'mid'), false);
  })();

  function step(){
    globalTime += 0.016;
    lightAngle += 0.0015;
    for (const b of blobs) b.update();

    for (let i = ripples.length - 1; i >= 0; i--){
      const rp = ripples[i];
      rp.r += 10 * DPR;
      rp.life -= 0.018;
      if (rp.life <= 0) ripples.splice(i, 1);
    }
  }

  function render(){
    if (cam.ready) updateCamFrame();

    octx.clearRect(0, 0, W, H);

    octx.globalCompositeOperation = 'source-over';
    for (const b of blobs) b.drawBody();

    octx.globalCompositeOperation = 'lighter';
    for (const b of blobs) b.drawShine();
    octx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.filter = `blur(${9 * DPR}px) contrast(1.3)`;
    ctx.drawImage(off, 0, 0);
    ctx.restore();

    // faint crisp ripple rings on top for extra life
    for (const rp of ripples){
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,255,255,${0.15 * rp.life})`;
      ctx.lineWidth = 1.5 * DPR;
      ctx.stroke();
    }
  }

  function loop(){
    step();
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
